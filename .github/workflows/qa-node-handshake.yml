name: QA Node Handshake

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/qa-node-handshake.yml"
      - "scripts/executor.py"
      - "scripts/test_executor.py"
      - "scripts/node_probe.py"
      - "scripts/validate_job.py"
      - "examples/jobs/smoke-demo.json"

permissions:
  contents: read

concurrency:
  group: allaiso-qa-node-handshake
  cancel-in-progress: false

jobs:
  handshake:
    # Dedicated label prevents this workflow from landing on an arbitrary runner.
    runs-on: [self-hosted, allaiso-qa]
    timeout-minutes: 10

    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4

      - name: Executor regression
        shell: powershell
        run: |
          $python = Get-Command python -ErrorAction SilentlyContinue
          $args = @()
          if (-not $python) {
            $python = Get-Command py -ErrorAction SilentlyContinue
            $args = @("-3")
          }
          if (-not $python) {
            throw "Python is not available to the GitHub runner identity."
          }
          & $python.Source @args scripts/test_executor.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Workstation probe
        shell: powershell
        run: |
          $python = Get-Command python -ErrorAction SilentlyContinue
          $args = @()
          if (-not $python) {
            $python = Get-Command py -ErrorAction SilentlyContinue
            $args = @("-3")
          }
          if (-not $python) {
            throw "Python is not available to the GitHub runner identity."
          }
          & $python.Source @args scripts/node_probe.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate committed smoke contract
        shell: powershell
        run: |
          $python = Get-Command python -ErrorAction SilentlyContinue
          $args = @()
          if (-not $python) {
            $python = Get-Command py -ErrorAction SilentlyContinue
            $args = @("-3")
          }
          if (-not $python) {
            throw "Python is not available to the GitHub runner identity."
          }
          & $python.Source @args scripts/validate_job.py examples/jobs/smoke-demo.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Diagnose OpenClaw runner context
        continue-on-error: true
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path .runtime | Out-Null
          $lines = @()
          $lines += "whoami=$(& whoami)"
          $lines += "USERNAME=$env:USERNAME"
          $lines += "USERPROFILE=$env:USERPROFILE"
          $lines += "HOME=$env:HOME"
          $lines += "SESSIONNAME=$env:SESSIONNAME"
          $lines += "OPENCLAW_HOME=$env:OPENCLAW_HOME"
          $lines += "OPENCLAW_CONFIG=$env:OPENCLAW_CONFIG"
          $openclaw = Get-Command openclaw -ErrorAction SilentlyContinue
          $lines += "openclaw_path=$($openclaw.Source)"
          $lines += "cdp_18890_reachable=$(Test-NetConnection 127.0.0.1 -Port 18890 -InformationLevel Quiet -WarningAction SilentlyContinue)"

          $gatewayOutput = (& openclaw gateway status 2>&1 | Out-String).Trim()
          $lines += "gateway_status_exit=$LASTEXITCODE"
          if ($gatewayOutput) {
            $lines += ($gatewayOutput -replace '(?i)(token|secret|password)\s*[:=]\s*\S+', '$1=[REDACTED]')
          }

          $browserOutput = (& openclaw browser --browser-profile qa-demo-public --timeout 10000 --json status 2>&1 | Out-String).Trim()
          $lines += "browser_status_exit=$LASTEXITCODE"
          if ($browserOutput) {
            $lines += $browserOutput
          }

          $lines | Tee-Object -FilePath .runtime/openclaw-context.txt
          exit 0

      - name: Probe OpenClaw browser capabilities
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path .runtime | Out-Null

          $versionOutput = (& openclaw --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "OpenClaw version probe failed."
          }

          $browserHelp = (& openclaw browser --help 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "OpenClaw browser help probe failed."
          }

          $typeHelp = (& openclaw browser type --help 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "OpenClaw browser type help probe failed."
          }

          $fillHelp = (& openclaw browser fill --help 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "OpenClaw browser fill help probe failed."
          }

          $typeUsage = (& openclaw browser type 2>&1 | Out-String).Trim()
          $typeUsageExit = $LASTEXITCODE
          $fillUsage = (& openclaw browser fill 2>&1 | Out-String).Trim()
          $fillUsageExit = $LASTEXITCODE

          $redact = {
            param([string]$value)
            if (-not $value) { return "" }
            return ($value -replace '(?i)(token|secret|password|authorization)\s*[:=]\s*\S+', '$1=[REDACTED]')
          }

          @(
            "version=$(& $redact $versionOutput)"
            ""
            "=== openclaw browser --help ==="
            (& $redact $browserHelp)
            ""
            "=== openclaw browser type --help ==="
            (& $redact $typeHelp)
            ""
            "=== openclaw browser fill --help ==="
            (& $redact $fillHelp)
            ""
            "=== openclaw browser type (no args; expected parser error) ==="
            "exit=$typeUsageExit"
            (& $redact $typeUsage)
            ""
            "=== openclaw browser fill (no args; expected parser error) ==="
            "exit=$fillUsageExit"
            (& $redact $fillUsage)
          ) | Set-Content .runtime/openclaw-browser-help.txt -Encoding utf8

      - name: Prepare unique runtime smoke job
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path .runtime | Out-Null

          $job = Get-Content examples/jobs/smoke-demo.json -Raw | ConvertFrom-Json
          $suffix = "${env:GITHUB_RUN_ID}-${env:GITHUB_RUN_ATTEMPT}"
          $job.job_id = "gh-handshake-$suffix"
          $job.run_id = "gh-handshake-$suffix"
          $job.timeout_seconds = 300

          $job | ConvertTo-Json -Depth 20 | Set-Content .runtime/handshake-job.json -Encoding utf8
          "QA_RUN_ID=$($job.run_id)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Execute OpenClaw browser smoke
        id: execute_smoke
        continue-on-error: true
        shell: powershell
        run: |
          $python = Get-Command python -ErrorAction SilentlyContinue
          $args = @()
          if (-not $python) {
            $python = Get-Command py -ErrorAction SilentlyContinue
            $args = @("-3")
          }
          if (-not $python) {
            throw "Python is not available to the GitHub runner identity."
          }
          & $python.Source @args scripts/executor.py .runtime/handshake-job.json
          exit $LASTEXITCODE

      - name: Verify smoke result
        if: always()
        shell: powershell
        run: |
          if (-not $env:QA_RUN_ID) {
            throw "QA_RUN_ID was not prepared."
          }

          $resultPath = "results/demo/$env:QA_RUN_ID/result.json"
          if (-not (Test-Path $resultPath)) {
            throw "Expected result was not produced: $resultPath"
          }

          $result = Get-Content $resultPath -Raw | ConvertFrom-Json
          Write-Host "Executor status: $($result.status)"
          Write-Host "Executor summary: $($result.summary)"

          if ($result.status -ne "PASSED") {
            throw "QA node handshake failed with executor status $($result.status)."
          }

          if (-not $result.evidence -or $result.evidence.Count -lt 1) {
            throw "QA node handshake passed without screenshot evidence."
          }

      - name: Upload handshake evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-node-handshake-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .runtime/node-probe.json
            .runtime/openclaw-context.txt
            .runtime/openclaw-browser-help.txt
            .runtime/handshake-job.json
            results/demo/gh-handshake-*/result.json
            evidence/demo/gh-handshake-*/**
          if-no-files-found: warn
          retention-days: 7
