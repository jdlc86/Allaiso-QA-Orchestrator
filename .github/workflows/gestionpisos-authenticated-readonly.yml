name: GestionPisos Authenticated Readonly

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gestionpisos-authenticated-readonly
  cancel-in-progress: false

jobs:
  authenticated-readonly:
    runs-on: [self-hosted, allaiso-qa]
    timeout-minutes: 10

    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4

      - name: Executor regression
        shell: powershell
        run: |
          $python = Get-Command python -ErrorAction SilentlyContinue
          $args = @()
          if (-not $python) {
            $python = Get-Command py -ErrorAction SilentlyContinue
            $args = @("-3")
          }
          if (-not $python) {
            throw "Python is not available to the GitHub runner identity."
          }
          & $python.Source @args scripts/test_executor.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate authenticated read-only contract
        shell: powershell
        run: |
          $python = Get-Command python -ErrorAction SilentlyContinue
          $args = @()
          if (-not $python) {
            $python = Get-Command py -ErrorAction SilentlyContinue
            $args = @("-3")
          }
          if (-not $python) {
            throw "Python is not available to the GitHub runner identity."
          }
          & $python.Source @args scripts/validate_job.py examples/jobs/gestionpisos-authenticated-readonly.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Diagnose isolated authenticated profile
        continue-on-error: true
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path .runtime | Out-Null
          $lines = @()
          $lines += "whoami=$(& whoami)"
          $lines += "SESSIONNAME=$env:SESSIONNAME"
          $openclaw = Get-Command openclaw -ErrorAction SilentlyContinue
          $lines += "openclaw_path=$($openclaw.Source)"
          $lines += "cdp_18892_reachable=$(Test-NetConnection 127.0.0.1 -Port 18892 -InformationLevel Quiet -WarningAction SilentlyContinue)"

          $gatewayOutput = (& openclaw gateway status 2>&1 | Out-String).Trim()
          $lines += "gateway_status_exit=$LASTEXITCODE"
          if ($gatewayOutput) {
            $lines += ($gatewayOutput -replace '(?i)(token|secret|password)\s*[:=]\s*\S+', '$1=[REDACTED]')
          }

          $browserOutput = (& openclaw browser --browser-profile qa-gestionpisos-auth --timeout 10000 --json status 2>&1 | Out-String).Trim()
          $lines += "browser_status_exit=$LASTEXITCODE"
          if ($browserOutput) {
            $lines += $browserOutput
          }

          $lines | Tee-Object -FilePath .runtime/openclaw-auth-context.txt
          exit 0

      - name: Prepare unique runtime job
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path .runtime | Out-Null

          $job = Get-Content examples/jobs/gestionpisos-authenticated-readonly.json -Raw | ConvertFrom-Json
          $suffix = "${env:GITHUB_RUN_ID}-${env:GITHUB_RUN_ATTEMPT}"
          $job.job_id = "gestionpisos-auth-$suffix"
          $job.run_id = "gestionpisos-auth-$suffix"
          $job.timeout_seconds = 300

          $job | ConvertTo-Json -Depth 20 | Set-Content .runtime/gestionpisos-auth-job.json -Encoding utf8
          "QA_RUN_ID=$($job.run_id)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Execute authenticated read-only probe
        id: execute_probe
        continue-on-error: true
        shell: powershell
        run: |
          $python = Get-Command python -ErrorAction SilentlyContinue
          $args = @()
          if (-not $python) {
            $python = Get-Command py -ErrorAction SilentlyContinue
            $args = @("-3")
          }
          if (-not $python) {
            throw "Python is not available to the GitHub runner identity."
          }
          & $python.Source @args scripts/executor.py .runtime/gestionpisos-auth-job.json
          exit $LASTEXITCODE

      - name: Verify authenticated read-only result
        if: always()
        shell: powershell
        run: |
          if (-not $env:QA_RUN_ID) {
            throw "QA_RUN_ID was not prepared."
          }

          $resultPath = "results/gestionpisos/$env:QA_RUN_ID/result.json"
          if (-not (Test-Path $resultPath)) {
            throw "Expected result was not produced: $resultPath"
          }

          $result = Get-Content $resultPath -Raw | ConvertFrom-Json
          Write-Host "Executor status: $($result.status)"
          Write-Host "Executor summary: $($result.summary)"

          if ($result.status -eq "PASSED") {
            if (-not $result.evidence -or $result.evidence.Count -lt 1) {
              throw "Authenticated read-only probe passed without screenshot evidence."
            }
            Write-Host "Reusable authenticated session is ready."
            exit 0
          }

          if ($result.status -eq "BLOCKED") {
            $diagnosticText = (($result.diagnostics | ForEach-Object { [string]$_ }) -join " ")
            if ($diagnosticText -notmatch "(?i)(authenticated|session|MFA)") {
              throw "Probe was BLOCKED for an unexpected reason: $diagnosticText"
            }
            Write-Host "Expected readiness block: $diagnosticText"
            exit 0
          }

          throw "Authenticated read-only probe ended with unexpected executor status $($result.status)."

      - name: Upload authenticated read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gestionpisos-authenticated-readonly-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .runtime/gestionpisos-auth-job.json
            .runtime/openclaw-auth-context.txt
            results/gestionpisos/gestionpisos-auth-*/result.json
            evidence/gestionpisos/gestionpisos-auth-*/**
          if-no-files-found: warn
          retention-days: 7
