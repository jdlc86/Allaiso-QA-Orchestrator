name: GestionPisos Public Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gestionpisos-public-smoke.yml"
      - "scripts/executor.py"
      - "scripts/test_executor.py"
      - "scripts/validate_job.py"
      - "projects/gestionpisos/**"
      - "examples/jobs/gestionpisos-public-smoke.json"

permissions:
  contents: read

concurrency:
  group: gestionpisos-public-smoke
  cancel-in-progress: false

jobs:
  public-smoke:
    runs-on: [self-hosted, allaiso-qa]
    timeout-minutes: 10

    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4

      - name: Executor regression
        shell: powershell
        run: |
          $python = Get-Command python -ErrorAction SilentlyContinue
          $args = @()
          if (-not $python) {
            $python = Get-Command py -ErrorAction SilentlyContinue
            $args = @("-3")
          }
          if (-not $python) {
            throw "Python is not available to the GitHub runner identity."
          }
          & $python.Source @args scripts/test_executor.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate smoke contract
        shell: powershell
        run: |
          $python = Get-Command python -ErrorAction SilentlyContinue
          $args = @()
          if (-not $python) {
            $python = Get-Command py -ErrorAction SilentlyContinue
            $args = @("-3")
          }
          if (-not $python) {
            throw "Python is not available to the GitHub runner identity."
          }
          & $python.Source @args scripts/validate_job.py examples/jobs/gestionpisos-public-smoke.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Diagnose OpenClaw runner context
        continue-on-error: true
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path .runtime | Out-Null
          $lines = @()
          $lines += "whoami=$(& whoami)"
          $lines += "USERNAME=$env:USERNAME"
          $lines += "USERPROFILE=$env:USERPROFILE"
          $lines += "HOME=$env:HOME"
          $lines += "SESSIONNAME=$env:SESSIONNAME"
          $lines += "OPENCLAW_HOME=$env:OPENCLAW_HOME"
          $lines += "OPENCLAW_CONFIG=$env:OPENCLAW_CONFIG"
          $openclaw = Get-Command openclaw -ErrorAction SilentlyContinue
          $lines += "openclaw_path=$($openclaw.Source)"
          $lines += "cdp_18891_reachable=$(Test-NetConnection 127.0.0.1 -Port 18891 -InformationLevel Quiet -WarningAction SilentlyContinue)"

          $gatewayOutput = (& openclaw gateway status 2>&1 | Out-String).Trim()
          $lines += "gateway_status_exit=$LASTEXITCODE"
          if ($gatewayOutput) {
            $lines += ($gatewayOutput -replace '(?i)(token|secret|password)\s*[:=]\s*\S+', '$1=[REDACTED]')
          }

          $browserOutput = (& openclaw browser --browser-profile qa-gestionpisos-public --timeout 10000 --json status 2>&1 | Out-String).Trim()
          $lines += "browser_status_exit=$LASTEXITCODE"
          if ($browserOutput) {
            $lines += $browserOutput
          }

          $lines | Tee-Object -FilePath .runtime/openclaw-context.txt
          exit 0

      - name: Prepare unique runtime job
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path .runtime | Out-Null

          $job = Get-Content examples/jobs/gestionpisos-public-smoke.json -Raw | ConvertFrom-Json
          $suffix = "${env:GITHUB_RUN_ID}-${env:GITHUB_RUN_ATTEMPT}"
          $job.job_id = "gestionpisos-public-$suffix"
          $job.run_id = "gestionpisos-public-$suffix"
          $job.timeout_seconds = 300

          $job | ConvertTo-Json -Depth 20 | Set-Content .runtime/gestionpisos-public-job.json -Encoding utf8
          "QA_RUN_ID=$($job.run_id)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Execute public smoke through OpenClaw
        id: execute_smoke
        continue-on-error: true
        shell: powershell
        run: |
          $python = Get-Command python -ErrorAction SilentlyContinue
          $args = @()
          if (-not $python) {
            $python = Get-Command py -ErrorAction SilentlyContinue
            $args = @("-3")
          }
          if (-not $python) {
            throw "Python is not available to the GitHub runner identity."
          }
          & $python.Source @args scripts/executor.py .runtime/gestionpisos-public-job.json
          exit $LASTEXITCODE

      - name: Verify public smoke result
        if: always()
        shell: powershell
        run: |
          if (-not $env:QA_RUN_ID) {
            throw "QA_RUN_ID was not prepared."
          }

          $resultPath = "results/gestionpisos/$env:QA_RUN_ID/result.json"
          if (-not (Test-Path $resultPath)) {
            throw "Expected result was not produced: $resultPath"
          }

          $result = Get-Content $resultPath -Raw | ConvertFrom-Json
          Write-Host "Executor status: $($result.status)"
          Write-Host "Executor summary: $($result.summary)"

          if ($result.status -ne "PASSED") {
            throw "GestionPisos public smoke failed with executor status $($result.status)."
          }

          if (-not $result.evidence -or $result.evidence.Count -lt 1) {
            throw "GestionPisos public smoke passed without screenshot evidence."
          }

      - name: Upload public smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gestionpisos-public-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .runtime/gestionpisos-public-job.json
            .runtime/openclaw-context.txt
            results/gestionpisos/gestionpisos-public-*/result.json
            evidence/gestionpisos/gestionpisos-public-*/**
          if-no-files-found: warn
          retention-days: 7
